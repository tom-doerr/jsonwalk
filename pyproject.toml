[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonwalk"
version = "0.1.0"
description = "Walk a base LM's completion tree to rank JSON field values, then judge them with a true/false logprob delta"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tom Doerr" }]
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jsonwalk = "jsonwalk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
